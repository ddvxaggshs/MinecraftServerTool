name: Publish Minecraft Relay
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: publish-minecraft-relay
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PySide6 pyinstaller
      - name: Build and verify release assets
        shell: pwsh
        run: |
          $state = $env:GITHUB_REF_NAME.Substring(1)
          python tools/build_release.py --state $state
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish immutable packages first
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $state = $env:GITHUB_REF_NAME.Substring(1)
          gh release create $env:GITHUB_REF_NAME "dist/$state/MinecraftRelay-source.zip" "dist/$state/MinecraftRelay-windows.zip" --verify-tag --title "Minecraft Relay $state" --generate-notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/checkout@v4
        with:
          ref: main
          path: publication
      - name: Publish the state only after packages are available
        shell: pwsh
        run: |
          $state = $env:GITHUB_REF_NAME.Substring(1)
          Copy-Item -LiteralPath "dist/$state/update.json" -Destination publication/update.json
          Set-Location publication
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Publish update state $state"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
